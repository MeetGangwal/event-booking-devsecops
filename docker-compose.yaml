services:
  mongodb:
    image: mongo:7
    container_name: ticketshield-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db
    networks:
      - ticketshield-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ticketshield-server
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/ticketshield?authSource=admin
      PORT: 5000
      JWT_SECRET: ticketshield_jwt_secret_change_in_production
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ticketshield-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ticketshield-client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - ticketshield-net

volumes:
  mongo-data:

networks:
  ticketshield-net:
    driver: bridge
