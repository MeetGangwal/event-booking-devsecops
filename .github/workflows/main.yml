name: CI_DevSecOps

on:
  push:
    tags:
      - "*"
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  security-events: write

jobs:
  sca_scan:
    name: Run Snyk and Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server dependencies
        working-directory: ./server
        run: npm install

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=server/package.json --severity-threshold=high --sarif-file-output=snyk-report.sarif

      - name: Upload Snyk findings
        if: always() && hashFiles('snyk-report.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: snyk-findings
          path: snyk-report.sarif

      - name: Upload Gitleaks findings
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: gitleaks-report.sarif

  sonarcloud_scan:
    name: SonarCloud Code Quality Analysis
    runs-on: ubuntu-latest
    needs: sca_scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=meetgangwal
            -Dsonar.projectKey=MeetGangwal_event-booking-devsecops
            -Dsonar.sources=client,server,app
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

  terraform_validate:
    name: Terraform Init Validate
    runs-on: ubuntu-latest
    needs: sonarcloud_scan

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

  image_scan:
    name: Build Image and Run Image Scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: terraform_validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/k8s-demo-app:v1.0 .

      - name: Docker Scout scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-demo-app:v1.0
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          only-severities: critical,high
          sarif-file: scout-report.sarif
          summary: true

      - name: Upload Docker Scout findings
        if: always() && hashFiles('scout-report.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scout-findings
          path: scout-report.sarif

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-demo-app:v1.0
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-findings
          path: trivy-results.sarif

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/k8s-demo-app:v1.0

  deploy-app-on-k3d-and-zap-scan:
    name: Deploy app on k3d and run ZAP scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: image_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create single k3d cluster with imported registry
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: CICD-test-cluster
          args: >-
            --agents 3
            --no-lb
            --k3s-arg "--no-deploy=traefik,servicelb,metrics-server@server:*"

      - name: Apply Kubernetes config
        run: |
          kubectl apply -f ./k8s/mongo-config.yaml

      - name: Create Mongo secret from GitHub Secrets
        run: |
          kubectl delete secret mongo-secret --ignore-not-found
          kubectl create secret generic mongo-secret \
            --from-literal=mongo-user="${{ secrets.MONGO_USERNAME }}" \
            --from-literal=mongo-password="${{ secrets.MONGO_PASSWORD }}"

      - name: Apply app manifests
        run: |
          kubectl apply -f ./k8s/mongo.yaml
          kubectl apply -f ./k8s/webapp.yaml

      - name: List pods and services
        run: |
          kubectl get pods
          kubectl get services

      - name: Wait for app
        run: |
          timeout 300s bash -c 'until kubectl get pods -l app=webapp | grep -q Running; do echo "waiting for pod"; sleep 5; done'
          sleep 15

      - name: Port forward service
        uses: aymanbagabas/kubectl-port-forward@v1
        with:
          context: CICD-test-cluster
          namespace: default
          resource: service/webapp-service
          port-mapping: 3000:3000

      - name: Test app
        run: |
          curl -v http://localhost:3000

      - name: ZAP scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_scan
