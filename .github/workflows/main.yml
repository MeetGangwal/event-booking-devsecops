name: CI_DevSecOps

on:
  push:
    tags:
      - "*"
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-demo-app
  IMAGE_TAG: v1.0

jobs:
  sca_scan:
    name: Run Snyk and Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server dependencies
        working-directory: ./server
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=server/package.json --severity-threshold=high --sarif-file-output=snyk-report.sarif

      - name: Upload Snyk findings
        if: always() && hashFiles('snyk-report.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: snyk-findings
          path: snyk-report.sarif

      - name: Upload Gitleaks findings
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: gitleaks-report.sarif

  sonarcloud_scan:
    name: SonarCloud Code Quality Analysis
    runs-on: ubuntu-latest
    needs: sca_scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=meetgangwal
            -Dsonar.projectKey=MeetGangwal_event-booking-devsecops
            -Dsonar.sources=client,server,app
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

  terraform_validate:
    name: Terraform Init Validate
    runs-on: ubuntu-latest
    needs: sonarcloud_scan

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

  image_scan:
    name: Build Image and Run Image Scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: terraform_validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Docker Scout scan
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          only-severities: critical,high
          sarif-file: scout-report.sarif
          summary: true

      - name: Upload Docker Scout findings
        if: always() && hashFiles('scout-report.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scout-findings
          path: scout-report.sarif

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-findings
          path: trivy-results.sarif

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push $IMAGE_NAME:$IMAGE_TAG

  deploy_app_on_k3d_and_zap_scan:
    name: Deploy app on k3d and run ZAP scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: image_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create single k3d cluster with imported registry
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: CICD-test-cluster
          args: >-
            --agents 3
            --no-lb
            --k3s-arg "--no-deploy=traefik,servicelb,metrics-server@server:*"

      - name: Apply Kubernetes config
        run: kubectl apply -f ./k8s/mongo-config.yaml

      - name: Create Mongo secret from GitHub Secrets
        run: |
          kubectl delete secret mongo-secret --ignore-not-found
          kubectl create secret generic mongo-secret \
            --from-literal=mongo-user="${{ secrets.MONGO_USERNAME }}" \
            --from-literal=mongo-password="${{ secrets.MONGO_PASSWORD }}"

      - name: Apply app manifests
        run: |
          kubectl apply -f ./k8s/mongo.yaml
          kubectl apply -f ./k8s/webapp.yaml

      - name: Show Kubernetes resources
        run: |
          kubectl get all
          kubectl get deployments || true
          kubectl get pods -o wide
          kubectl get services

      - name: Wait for webapp pod
        run: |
          timeout 300s bash -c 'until kubectl get pods -l app=webapp --no-headers 2>/dev/null | grep -q Running; do echo "waiting for webapp pod"; kubectl get pods -l app=webapp || true; sleep 5; done'
          sleep 15

      - name: Port forward service
        run: |
          nohup kubectl port-forward -n default service/webapp-service 3000:3000 > /tmp/port-forward.log 2>&1 &
          sleep 15
          cat /tmp/port-forward.log || true

      - name: Test app
        run: curl -f http://localhost:3000

      - name: ZAP scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_scan

  notify_status:
    name: Notify Pipeline Status
    if: always()
    runs-on: ubuntu-latest
    needs:
      - sca_scan
      - sonarcloud_scan
      - terraform_validate
      - image_scan
      - deploy_app_on_k3d_and_zap_scan

    steps:
      - name: Pipeline failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "Pipeline failed."
          echo "Add Slack, Teams, or email notification here."

      - name: Pipeline cancelled
        if: contains(needs.*.result, 'cancelled')
        run: |
          echo "Pipeline was cancelled."

      - name: Pipeline succeeded
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Pipeline completed successfully."
